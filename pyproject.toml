[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacemolt-commander"
version = "0.5.0"
description = "Autonomous AI agent for the SpaceMolt MMO — Python edition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
spacemolt = "spacemolt.cli:main"

[tool.setuptools.packages.find]
include = ["spacemolt*"]

[tool.ruff]
line-length = 100
target-version = "py310"

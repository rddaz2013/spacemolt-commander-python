# ============================================================================
# QUICK SELECTION GUIDE
# ============================================================================

# "I want the best experience"
# → Use PRESET 1 (Hybrid) with Anthropic Claude

# "I have no budget"
# → Use PRESET 3 (Local Only) with qwen3:8b

# "I want maximum speed"
# → Use PRESET 5 (Groq) or PRESET 3 (Ollama)

# "I want to use Ollama"
# → Use PRESET 3 (Local) with your chosen model

# "I have Abacus.AI subscription"
# → Use PRESET 6 (Abacus.AI)

# "I want to run multiple bots"
# → Use PRESET 7 (Multiple Sessions)

# "I'm debugging an issue"
# → Use PRESET 8 (Debug Mode)

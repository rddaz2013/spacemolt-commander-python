# session_name: "default"
# mission: "Mine ore and maximize profit without going offline."
# debug: false
# force_credentials: false
# backend: "local"

# Cost: $0 (completely free)
# Quality: ★★★ Good — sufficient for most tasks
# Speed: ⚡⚡⚡ Very fast (everything local)
# Dependencies: Ollama installed + running



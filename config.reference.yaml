# ============================================================================
# PRESET 7: Multiple Sessions (Farming + Trading)
# Two separate bots with different strategies
# ============================================================================

# Session 1: Farming Bot (mining ore)
# ========================
# cloud_model: "anthropic/claude-sonnet-4-20250514"
# local_model: "ollama/qwen3:8b"
# api_url: "https://game.spacemolt.com/api/v2"
# session_name: "farm-bot"
# mission: "Mine ore continuously and maximize yield."
# backend: "auto"

# Session 2: Trading Bot (profit maximization)
# ========================
# cloud_model: "anthropic/claude-sonnet-4-20250514"
# local_model: "ollama/llama3.1:8b"
# api_url: "https://game.spacemolt.com/api/v2"
# session_name: "trader-bot"
# mission: "Find and execute profitable trade routes."
# backend: "cloud"  # Cloud for better trading decisions

# Start sessions in separate terminals:
# Terminal 1: python -m spacemolt run "..." --session farm-bot
# Terminal 2: python -m spacemolt run "..." --session trader-bot


# ============================================================================
# PRESET 8: Debug & Development
# Verbose logging for troubleshooting
# ============================================================================

# cloud_model: "anthropic/claude-sonnet-4-20250514"
# local_model: "ollama/qwen3:8b"
# api_url: "https://game.spacemolt.com/api/v2"
# session_name: "debug"
# mission: "Test basic game mechanics."
# debug: true  # ← Enable verbose logging
# force_credentials: true  # ← Always prompt for credentials
# backend: "auto"

# Logs saved to: ~/.spacemolt_commander/logs/
# Check logs for troubleshooting


# ============================================================================
# ENVIRONMENT VARIABLES TO SET
# ============================================================================

# Anthropic Claude
# ================
# export ANTHROPIC_API_KEY="sk-ant-[your-key-here]"
# Get from: https://console.anthropic.com/

# OpenAI GPT
# ==========
# export OPENAI_API_KEY="sk-[your-key-here]"
# Get from: https://platform.openai.com/api-keys

# Groq (free)
# ===========
# export GROQ_API_KEY="gsk_[your-key-here]"
# Get from: https://console.groq.com/keys

# Abacus.AI
# =========
# export ABACUS_API_KEY="[your-key-here]"
# Get from: https://abacus.ai/app/account



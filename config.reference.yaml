# SpaceMolt Commander — Configuration Reference
# This file contains example configurations for different scenarios
# Copy the relevant section to your config.yaml

# ============================================================================
# PRESET 1: Best Overall (Recommended)
# Cloud + Local Hybrid with Auto-Routing
# ============================================================================

# cloud_model: "anthropic/claude-sonnet-4-20250514"
# local_model: "ollama/qwen3:8b"
# api_url: "https://game.spacemolt.com/api/v2"
# session_name: "default"
# mission: "Explore the galaxy, mine ore, trade for profit, and grow stronger."
# debug: false
# force_credentials: false
# backend: "auto"

# Cost: ~$0.10–$0.50 per day
# Quality: ★★★★★ Excellent
# Speed: Fast for simple tasks, optimized for complex decisions
# Dependencies: API key (Anthropic) + Ollama running


# ============================================================================
# PRESET 2: Cloud Only (Best Quality)
# Maximum intelligence for strategic gameplay
# ============================================================================

# cloud_model: "anthropic/claude-sonnet-4-20250514"
# local_model: "ollama/qwen3:8b"  # Not used, can be anything
# api_url: "https://game.spacemolt.com/api/v2"
# session_name: "default"
# mission: "Execute the most profitable strategy possible."
# debug: false
# force_credentials: false
# backend: "cloud"

# Cost: ~$0.50–$2 per day
# Quality: ★★★★★ Excellent — best decision making
# Speed: Slightly slower due to cloud latency
# Dependencies: API key (Anthropic)


# ============================================================================
# PRESET 3: Local Only (Free & Private)
